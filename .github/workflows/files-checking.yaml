name: Application Deployment

on:
  push:
    branches:
      - developer

jobs:

  # ==========================================================
  # BUILD JOB
  # ==========================================================

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # --------------------------------------------------------
      # Enable Yarn
      # --------------------------------------------------------

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version


      # --------------------------------------------------------
      # Install frontend dependencies
      # --------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile


      # --------------------------------------------------------
      # Build React application
      # --------------------------------------------------------

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn build


      # --------------------------------------------------------
      # Upload frontend build
      # --------------------------------------------------------

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # Install backend dependencies
      # --------------------------------------------------------

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt


      # --------------------------------------------------------
      # Check Python backend syntax
      # --------------------------------------------------------

      - name: Check Python backend
        run: |
          python -m py_compile backend/main.py


      # --------------------------------------------------------
      # Upload backend files
      # --------------------------------------------------------

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: |
            backend/main.py
            backend/requirements.txt


  # ==========================================================
  # DEPLOY JOB
  # ==========================================================

  deploy:
    name: Deploy Application
    needs: build
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Download frontend artifact
      # --------------------------------------------------------

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist


      # --------------------------------------------------------
      # Download backend artifact
      # --------------------------------------------------------

      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: backend


      # ========================================================
      # SETUP SSH
      # ========================================================

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/github-actions

          chmod 600 ~/.ssh/github-actions

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts


      # ========================================================
      # PREPARE EC2
      # ========================================================

      - name: Prepare EC2 server
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

            set -e

            echo "Updating package list..."

            sudo apt-get update

            echo "Installing required packages..."

            sudo apt-get install -y \
              nginx \
              python3 \
              python3-pip \
              python3-venv \
              curl

            echo "EC2 preparation completed"

          EOF


      # ========================================================
      # CREATE RELEASE DIRECTORIES
      # ========================================================

      - name: Create release directories
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

            set -e

            sudo mkdir -p /var/www/cicd-app/releases

            sudo mkdir -p /opt/cicd-app-backend/releases

            sudo chown -R "$USER:$USER" /var/www/cicd-app

            sudo chown -R "$USER:$USER" /opt/cicd-app-backend

            echo "Release directories ready"

          EOF


      # ========================================================
      # CREATE NEW RELEASE DIRECTORY
      # ========================================================

      - name: Create application release
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << EOF

            set -e

            mkdir -p /var/www/cicd-app/releases/${{ github.sha }}

            mkdir -p /opt/cicd-app-backend/releases/${{ github.sha }}

            echo "Release created:"
            echo "${{ github.sha }}"

          EOF


      # ========================================================
      # DEPLOY FRONTEND
      # ========================================================

      - name: Deploy frontend to release
        run: |
          scp -i ~/.ssh/github-actions -r \
            frontend/dist/* \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/cicd-app/releases/${{ github.sha }}/"


      # ========================================================
      # DEPLOY BACKEND
      # ========================================================

      - name: Deploy backend to release
        run: |
          scp -i ~/.ssh/github-actions -r \
            backend/* \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/cicd-app-backend/releases/${{ github.sha }}/"


      # ========================================================
      # CREATE PYTHON VIRTUAL ENVIRONMENT
      # ========================================================

      - name: Setup backend environment
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << EOF

            set -e

            cd /opt/cicd-app-backend/releases/${{ github.sha }}

            python3 -m venv venv

            ./venv/bin/pip install --upgrade pip

            ./venv/bin/pip install -r requirements.txt

            echo "Backend environment ready"

          EOF

      # ========================================================
      # CONFIGURE NGINX
      # ========================================================

      - name: Configure NGINX
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo rm -f /etc/nginx/sites-enabled/default && \
             sudo tee /etc/nginx/sites-available/cicd-app > /dev/null <<'NGINX'
            server {
            listen 4000;
            listen [::]:4000;

            root /var/www/cicd-app/current;
            index index.html;

            location / {
                try_files \$uri \$uri/ /index.html;
            }

            location /api/ {
                proxy_pass http://127.0.0.1:8000/;

                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
                }
                }
                NGINX
                            sudo ln -sfn /etc/nginx/sites-available/cicd-app /etc/nginx/sites-enabled/cicd-app && \
                            echo 'Checking NGINX configuration...' && \
                            sudo nginx -t && \
                            echo 'Checking symbolic link...' && \
                            sudo ls -l /etc/nginx/sites-enabled/cicd-app && \
                            sudo systemctl enable nginx && \
                            sudo systemctl restart nginx"
      # ========================================================
      # ACTIVATE RELEASE
      # ========================================================

      - name: Activate release
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << EOF

            set -e

            RELEASE="${{ github.sha }}"

            FRONTEND_CURRENT="/var/www/cicd-app/current"

            BACKEND_CURRENT="/opt/cicd-app-backend/current"

            FRONTEND_RELEASE="/var/www/cicd-app/releases/\$RELEASE"

            BACKEND_RELEASE="/opt/cicd-app-backend/releases/\$RELEASE"


            # ==================================================
            # SAVE PREVIOUS RELEASE
            # ==================================================

            PREVIOUS_FRONTEND=""

            PREVIOUS_BACKEND=""

            if [ -L "\$FRONTEND_CURRENT" ]; then
              PREVIOUS_FRONTEND=\$(readlink -f "\$FRONTEND_CURRENT")
            fi

            if [ -L "\$BACKEND_CURRENT" ]; then
              PREVIOUS_BACKEND=\$(readlink -f "\$BACKEND_CURRENT")
            fi


            echo "======================================"

            echo "Previous frontend:"
            echo "\$PREVIOUS_FRONTEND"

            echo "Previous backend:"
            echo "\$PREVIOUS_BACKEND"

            echo "======================================"


            # ==================================================
            # ACTIVATE NEW FRONTEND
            # ==================================================

            echo "Activating frontend..."

            ln -sfn \
              "\$FRONTEND_RELEASE" \
              "\$FRONTEND_CURRENT"


            # ==================================================
            # ACTIVATE NEW BACKEND
            # ==================================================

            echo "Activating backend..."

            ln -sfn \
              "\$BACKEND_RELEASE" \
              "\$BACKEND_CURRENT"


            # ==================================================
            # CREATE SYSTEMD SERVICE
            # ==================================================

            echo "Creating backend systemd service..."

            sudo tee /etc/systemd/system/cicd-backend.service > /dev/null << 'SERVICE'

            [Unit]
            Description=CI/CD FastAPI Backend
            After=network.target

            [Service]
            User=ubuntu
            WorkingDirectory=/opt/cicd-app-backend/current
            ExecStart=/opt/cicd-app-backend/current/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target

            SERVICE


            # ==================================================
            # RELOAD SYSTEMD
            # ==================================================

            sudo systemctl daemon-reload

            sudo systemctl enable cicd-backend

            sudo systemctl restart cicd-backend


            # ==================================================
            # WAIT FOR BACKEND
            # ==================================================

            echo "Waiting for backend..."

            sleep 5


            # ==================================================
            # BACKEND HEALTH CHECK
            # ==================================================

            echo "Checking backend..."

            if ! curl -f http://127.0.0.1:8000/health; then

              echo "Backend health check FAILED"

              echo "Starting rollback..."


              # ----------------------------------------------
              # Rollback frontend
              # ----------------------------------------------

              if [ -n "\$PREVIOUS_FRONTEND" ]; then
                ln -sfn "\$PREVIOUS_FRONTEND" "\$FRONTEND_CURRENT"
              else
                rm -f "\$FRONTEND_CURRENT"
              fi


              # ----------------------------------------------
              # Rollback backend
              # ----------------------------------------------

              if [ -n "\$PREVIOUS_BACKEND" ]; then
                ln -sfn "\$PREVIOUS_BACKEND" "\$BACKEND_CURRENT"
              else
                rm -f "\$BACKEND_CURRENT"
              fi


              sudo systemctl restart cicd-backend

              echo "Rollback completed"

              exit 1

            fi


            echo "Backend health check PASSED"


            # ==================================================
            # NGINX / API HEALTH CHECK
            # ==================================================

            echo "Checking NGINX/API..."

            if ! curl -f http://127.0.0.1:4000/api/health; then

              echo "NGINX/API health check FAILED"

              echo "Starting rollback..."


              # ----------------------------------------------
              # Rollback frontend
              # ----------------------------------------------

              if [ -n "\$PREVIOUS_FRONTEND" ]; then
                ln -sfn "\$PREVIOUS_FRONTEND" "\$FRONTEND_CURRENT"
              else
                rm -f "\$FRONTEND_CURRENT"
              fi


              # ----------------------------------------------
              # Rollback backend
              # ----------------------------------------------

              if [ -n "\$PREVIOUS_BACKEND" ]; then
                ln -sfn "\$PREVIOUS_BACKEND" "\$BACKEND_CURRENT"
              else
                rm -f "\$BACKEND_CURRENT"
              fi


              sudo systemctl restart cicd-backend

              echo "Rollback completed"

              exit 1

            fi


            echo "NGINX/API health check PASSED"


            # ==================================================
            # FRONTEND HEALTH CHECK
            # ==================================================

            echo "Checking frontend..."

            if ! curl -f http://127.0.0.1:4000; then

              echo "Frontend health check FAILED"

              echo "Starting rollback..."


              # ----------------------------------------------
              # Rollback frontend
              # ----------------------------------------------

              if [ -n "\$PREVIOUS_FRONTEND" ]; then
                ln -sfn "\$PREVIOUS_FRONTEND" "\$FRONTEND_CURRENT"
              else
                rm -f "\$FRONTEND_CURRENT"
              fi


              # ----------------------------------------------
              # Rollback backend
              # ----------------------------------------------

              if [ -n "\$PREVIOUS_BACKEND" ]; then
                ln -sfn "\$PREVIOUS_BACKEND" "\$BACKEND_CURRENT"
              else
                rm -f "\$BACKEND_CURRENT"
              fi


              sudo systemctl restart cicd-backend

              echo "Rollback completed"

              exit 1

            fi


            echo "Frontend health check PASSED"


            # ==================================================
            # DEPLOYMENT SUCCESS
            # ==================================================

            echo "======================================"

            echo "DEPLOYMENT SUCCESSFUL"

            echo "Release:"
            echo "\$RELEASE"

            echo "======================================"

          EOF


      # ========================================================
      # VERIFY DEPLOYMENT
      # ========================================================

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

            echo "======================================"

            echo "NGINX enabled site:"

            sudo ls -l /etc/nginx/sites-enabled/

            echo "======================================"

            echo "Frontend current release:"

            readlink -f /var/www/cicd-app/current || true

            echo "======================================"

            echo "Backend current release:"

            readlink -f /opt/cicd-app-backend/current || true

            echo "======================================"

            echo "Listening ports:"

            sudo ss -tulpn | grep -E ':4000|:8000' || true

            echo "======================================"

            echo "Backend service:"

            sudo systemctl --no-pager status cicd-backend || true

            echo "======================================"

            echo "Deployment verification completed"

          EOF


      # ========================================================
      # CLEAN OLD RELEASES
      # ========================================================

      - name: Cleanup old releases
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

            echo "Cleaning old frontend releases..."

            cd /var/www/cicd-app/releases

            ls -dt */ 2>/dev/null | tail -n +4 | xargs -r rm -rf


            echo "Cleaning old backend releases..."

            cd /opt/cicd-app-backend/releases

            ls -dt */ 2>/dev/null | tail -n +4 | xargs -r rm -rf


            echo "Old releases cleaned"

          EOF


      # ========================================================
      # DEPLOYMENT SUMMARY
      # ========================================================

      - name: Deployment completed
        run: |
          echo "======================================"
          echo "Deployment completed successfully"
          echo "Release: ${{ github.sha }}"
          echo "======================================"
