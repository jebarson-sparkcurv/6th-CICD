name: Application Deployment

on:
  push:
    branches:
      - developer

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install

      - name: Build frontend
        working-directory: frontend
        run: yarn build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python backend
        run: |
          python -m py_compile backend/main.py


  deploy:
    name: Prepare EC2
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/github-actions

          chmod 600 ~/.ssh/github-actions

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare EC2 server
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

            sudo apt-get update

            sudo apt-get install -y nginx

            sudo apt-get install -y python3
            sudo apt-get install -y python3-pip
            sudo apt-get install -y python3-venv
            sudo apt-get install -y curl

            echo "EC2 preparation completed"

          EOF

      - name: Create frontend directory
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo mkdir -p /var/www/cicd-app && sudo chown -R \$USER:\$USER /var/www/cicd-app"

      - name: Deploy frontend to EC2
        run: |
          scp -i ~/.ssh/github-actions -r \
            frontend/dist/* \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/cicd-app/"
      - name: Configure NGINX
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

            sudo tee /etc/nginx/sites-available/cicd-app > /dev/null << 'NGINX'
            server {
                listen 4000;

                root /var/www/cicd-app;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            NGINX

            sudo ln -sf /etc/nginx/sites-available/cicd-app /etc/nginx/sites-enabled/cicd-app

            sudo nginx -t

            sudo systemctl restart nginx

            echo "NGINX configured successfully"
      - name: Check frontend health
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "curl -f http://localhost:4000"

          EOF
          
