name: Application Deployment

on:
  push:
    branches:
      - developer

jobs:

  # ==========================================================
  # BUILD JOB
  # ==========================================================

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # --------------------------------------------------------
      # Yarn
      # --------------------------------------------------------

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version


      # --------------------------------------------------------
      # Frontend dependencies
      # --------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile


      # --------------------------------------------------------
      # Build frontend
      # --------------------------------------------------------

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn build


      # --------------------------------------------------------
      # Upload frontend build
      # --------------------------------------------------------

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # Backend dependencies
      # --------------------------------------------------------

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt


      # --------------------------------------------------------
      # Backend syntax check
      # --------------------------------------------------------

      - name: Check Python backend
        run: |
          python -m py_compile backend/main.py


      # --------------------------------------------------------
      # Upload backend
      # --------------------------------------------------------

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: |
            backend/main.py
            backend/requirements.txt


  # ==========================================================
  # DEPLOY JOB
  # ==========================================================

  deploy:
    name: Deploy Application
    needs: build
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # DOWNLOAD FRONTEND ARTIFACT
      # ========================================================

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist


      # ========================================================
      # DOWNLOAD BACKEND ARTIFACT
      # ========================================================

      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: backend


      # ========================================================
      # SETUP SSH
      # ========================================================

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/github-actions

          chmod 600 ~/.ssh/github-actions

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts


      # ========================================================
      # CREATE NGINX CONFIGURATION
      # ========================================================

      - name: Create NGINX configuration
        run: |
          printf '%s\n' \
          'server {' \
          '    listen 4000;' \
          '    listen [::]:4000;' \
          '' \
          '    root /var/www/cicd-app/current;' \
          '    index index.html;' \
          '' \
          '    location / {' \
          '        try_files $uri $uri/ /index.html;' \
          '    }' \
          '' \
          '    location /api/ {' \
          '        proxy_pass http://127.0.0.1:8000/;' \
          '' \
          '        proxy_set_header Host $host;' \
          '        proxy_set_header X-Real-IP $remote_addr;' \
          '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
          '        proxy_set_header X-Forwarded-Proto $scheme;' \
          '    }' \
          '}' \
          > nginx-cicd-app.conf

          echo "======================================"
          echo "NGINX configuration created"
          echo "======================================"

          cat nginx-cicd-app.conf


      # ========================================================
      # CREATE SYSTEMD SERVICE
      # ========================================================

      - name: Create systemd service configuration
        run: |
          printf '%s\n' \
          '[Unit]' \
          'Description=CI/CD FastAPI Backend' \
          'After=network.target' \
          '' \
          '[Service]' \
          'User=ubuntu' \
          'WorkingDirectory=/opt/cicd-app-backend/current' \
          'ExecStart=/opt/cicd-app-backend/current/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000' \
          'Restart=always' \
          'RestartSec=5' \
          '' \
          '[Install]' \
          'WantedBy=multi-user.target' \
          > cicd-backend.service

          echo "======================================"
          echo "Systemd service created"
          echo "======================================"

          cat cicd-backend.service


      # ========================================================
      # PREPARE EC2
      # ========================================================

      - name: Prepare EC2 server
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo apt-get update && \
             sudo apt-get install -y nginx python3 python3-pip python3-venv curl"

          echo "EC2 preparation completed"


      # ========================================================
      # CREATE RELEASE DIRECTORIES
      # ========================================================

      - name: Create release directories
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo mkdir -p /var/www/cicd-app/releases && \
             sudo mkdir -p /opt/cicd-app-backend/releases && \
             sudo chown -R \$USER:\$USER /var/www/cicd-app && \
             sudo chown -R \$USER:\$USER /opt/cicd-app-backend"

          echo "Release directories ready"


      # ========================================================
      # CREATE NEW RELEASE
      # ========================================================

      - name: Create application release
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p /var/www/cicd-app/releases/${{ github.sha }} && \
             mkdir -p /opt/cicd-app-backend/releases/${{ github.sha }}"

          echo "Release created: ${{ github.sha }}"


      # ========================================================
      # DEPLOY FRONTEND
      # ========================================================

      - name: Deploy frontend
        run: |
          scp -i ~/.ssh/github-actions -r \
            frontend/dist/* \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/cicd-app/releases/${{ github.sha }}/"

          echo "Frontend deployed to release directory"


      # ========================================================
      # DEPLOY BACKEND
      # ========================================================

      - name: Deploy backend
        run: |
          scp -i ~/.ssh/github-actions -r \
            backend/* \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/cicd-app-backend/releases/${{ github.sha }}/"

          echo "Backend deployed to release directory"


      # ========================================================
      # CREATE PYTHON VIRTUAL ENVIRONMENT
      # ========================================================

      - name: Setup backend environment
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd /opt/cicd-app-backend/releases/${{ github.sha }} && \
             python3 -m venv venv && \
             ./venv/bin/pip install --upgrade pip && \
             ./venv/bin/pip install -r requirements.txt"

          echo "Python virtual environment created"


      # ========================================================
      # COPY NGINX CONFIG TO EC2
      # ========================================================

      - name: Deploy NGINX configuration
        run: |
          scp -i ~/.ssh/github-actions \
            nginx-cicd-app.conf \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/cicd-app"

          echo "NGINX configuration copied to EC2"


      # ========================================================
      # INSTALL NGINX CONFIGURATION
      # ========================================================

      - name: Enable NGINX
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo mv /tmp/cicd-app /etc/nginx/sites-available/cicd-app && \
             sudo rm -f /etc/nginx/sites-enabled/default && \
             sudo ln -sfn /etc/nginx/sites-available/cicd-app /etc/nginx/sites-enabled/cicd-app && \
             echo 'Checking NGINX configuration...' && \
             sudo nginx -t && \
             sudo systemctl enable nginx && \
             sudo systemctl restart nginx && \
             echo 'NGINX configuration installed successfully' && \
             sudo ls -la /etc/nginx/sites-enabled/"

          echo "NGINX enabled successfully"


      # ========================================================
      # COPY SYSTEMD SERVICE TO EC2
      # ========================================================

      - name: Deploy systemd service
        run: |
          scp -i ~/.ssh/github-actions \
            cicd-backend.service \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/cicd-backend.service"

          echo "Systemd service copied to EC2"


      # ========================================================
      # INSTALL SYSTEMD SERVICE
      # ========================================================

      - name: Enable backend service
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo mv /tmp/cicd-backend.service /etc/systemd/system/cicd-backend.service && \
             sudo systemctl daemon-reload && \
             sudo systemctl enable cicd-backend"

          echo "Backend service installed"


      # ========================================================
      # ACTIVATE RELEASE
      # ========================================================

      - name: Activate release
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "RELEASE='${{ github.sha }}'; \
             FRONTEND_CURRENT='/var/www/cicd-app/current'; \
             BACKEND_CURRENT='/opt/cicd-app-backend/current'; \
             FRONTEND_RELEASE='/var/www/cicd-app/releases/$RELEASE'; \
             BACKEND_RELEASE='/opt/cicd-app-backend/releases/$RELEASE'; \
             PREVIOUS_FRONTEND=''; \
             PREVIOUS_BACKEND=''; \
             if [ -L \"\$FRONTEND_CURRENT\" ]; then \
               PREVIOUS_FRONTEND=\$(readlink -f \"\$FRONTEND_CURRENT\"); \
             fi; \
             if [ -L \"\$BACKEND_CURRENT\" ]; then \
               PREVIOUS_BACKEND=\$(readlink -f \"\$BACKEND_CURRENT\"); \
             fi; \
             echo '======================================'; \
             echo \"Previous frontend: \$PREVIOUS_FRONTEND\"; \
             echo \"Previous backend: \$PREVIOUS_BACKEND\"; \
             echo '======================================'; \
             ln -sfn \"\$FRONTEND_RELEASE\" \"\$FRONTEND_CURRENT\"; \
             ln -sfn \"\$BACKEND_RELEASE\" \"\$BACKEND_CURRENT\"; \
             echo 'New release activated'; \
             sudo systemctl restart cicd-backend; \
             echo 'Waiting for backend...'; \
             sleep 5; \
             if ! curl --fail --silent --show-error --retry 5 --retry-delay 2 http://127.0.0.1:8000/health; then \
               echo '======================================'; \
               echo 'BACKEND HEALTH CHECK FAILED'; \
               echo 'Starting rollback...'; \
               echo '======================================'; \
               if [ -n \"\$PREVIOUS_FRONTEND\" ]; then \
                 ln -sfn \"\$PREVIOUS_FRONTEND\" \"\$FRONTEND_CURRENT\"; \
               else \
                 rm -f \"\$FRONTEND_CURRENT\"; \
               fi; \
               if [ -n \"\$PREVIOUS_BACKEND\" ]; then \
                 ln -sfn \"\$PREVIOUS_BACKEND\" \"\$BACKEND_CURRENT\"; \
               else \
                 rm -f \"\$BACKEND_CURRENT\"; \
               fi; \
               sudo systemctl restart cicd-backend; \
               echo 'Rollback completed'; \
               exit 1; \
             fi; \
             echo; \
             echo 'Backend health check PASSED'; \
             if ! curl --fail --silent --show-error --retry 5 --retry-delay 2 http://127.0.0.1:4000/api/health; then \
               echo '======================================'; \
               echo 'NGINX/API HEALTH CHECK FAILED'; \
               echo 'Starting rollback...'; \
               echo '======================================'; \
               if [ -n \"\$PREVIOUS_FRONTEND\" ]; then \
                 ln -sfn \"\$PREVIOUS_FRONTEND\" \"\$FRONTEND_CURRENT\"; \
               else \
                 rm -f \"\$FRONTEND_CURRENT\"; \
               fi; \
               if [ -n \"\$PREVIOUS_BACKEND\" ]; then \
                 ln -sfn \"\$PREVIOUS_BACKEND\" \"\$BACKEND_CURRENT\"; \
               else \
                 rm -f \"\$BACKEND_CURRENT\"; \
               fi; \
               sudo systemctl restart cicd-backend; \
               echo 'Rollback completed'; \
               exit 1; \
             fi; \
             echo; \
             echo 'NGINX/API health check PASSED'; \
             if ! curl --fail --silent --show-error --retry 5 --retry-delay 2 http://127.0.0.1:4000; then \
               echo '======================================'; \
               echo 'FRONTEND HEALTH CHECK FAILED'; \
               echo 'Starting rollback...'; \
               echo '======================================'; \
               if [ -n \"\$PREVIOUS_FRONTEND\" ]; then \
                 ln -sfn \"\$PREVIOUS_FRONTEND\" \"\$FRONTEND_CURRENT\"; \
               else \
                 rm -f \"\$FRONTEND_CURRENT\"; \
               fi; \
               if [ -n \"\$PREVIOUS_BACKEND\" ]; then \
                 ln -sfn \"\$PREVIOUS_BACKEND\" \"\$BACKEND_CURRENT\"; \
               else \
                 rm -f \"\$BACKEND_CURRENT\"; \
               fi; \
               sudo systemctl restart cicd-backend; \
               echo 'Rollback completed'; \
               exit 1; \
             fi; \
             echo; \
             echo 'Frontend health check PASSED'; \
             echo '======================================'; \
             echo 'DEPLOYMENT SUCCESSFUL'; \
             echo \"Release: \$RELEASE\"; \
             echo '======================================'"


      # ========================================================
      # VERIFY DEPLOYMENT
      # ========================================================

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "echo '======================================'; \
             echo 'NGINX ENABLED SITES'; \
             sudo ls -la /etc/nginx/sites-enabled/; \
             echo '======================================'; \
             echo 'NGINX CONFIGURATION'; \
             sudo cat /etc/nginx/sites-available/cicd-app; \
             echo '======================================'; \
             echo 'NGINX TEST'; \
             sudo nginx -t; \
             echo '======================================'; \
             echo 'FRONTEND CURRENT'; \
             readlink -f /var/www/cicd-app/current || true; \
             echo '======================================'; \
             echo 'BACKEND CURRENT'; \
             readlink -f /opt/cicd-app-backend/current || true; \
             echo '======================================'; \
             echo 'LISTENING PORTS'; \
             sudo ss -tulpn | grep -E ':4000|:8000' || true; \
             echo '======================================'; \
             echo 'BACKEND SERVICE'; \
             sudo systemctl --no-pager status cicd-backend || true; \
             echo '======================================'"


      # ========================================================
      # CLEAN OLD RELEASES
      # ========================================================

      - name: Cleanup old releases
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd /var/www/cicd-app/releases && \
             ls -dt */ 2>/dev/null | tail -n +4 | xargs -r rm -rf && \
             cd /opt/cicd-app-backend/releases && \
             ls -dt */ 2>/dev/null | tail -n +4 | xargs -r rm -rf"

          echo "Old releases cleaned"


      # ========================================================
      # FINAL SUMMARY
      # ========================================================

      - name: Deployment completed
        run: |
          echo "======================================"
          echo "DEPLOYMENT PIPELINE COMPLETED"
          echo "======================================"
          echo "Release: ${{ github.sha }}"
          echo "Environment: EC2 Testing Server"
          echo "Frontend: NGINX :4000"
          echo "Backend: FastAPI :8000"
          echo "======================================"
