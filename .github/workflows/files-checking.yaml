name: Application Deployment

on:
  push:
    branches:
      - developer

jobs:

  # ==========================================================
  # BUILD JOB
  # ==========================================================

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # --------------------------------------------------------
      # Enable Yarn
      # --------------------------------------------------------

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate


      # --------------------------------------------------------
      # Install frontend dependencies
      # --------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install


      # --------------------------------------------------------
      # Build React application
      # --------------------------------------------------------

      - name: Build frontend
        working-directory: frontend
        run: yarn build


      # --------------------------------------------------------
      # Save frontend build
      # --------------------------------------------------------

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # Install backend dependencies
      # --------------------------------------------------------

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt


      # --------------------------------------------------------
      # Check Python syntax
      # --------------------------------------------------------

      - name: Check Python backend
        run: |
          python -m py_compile backend/main.py


      # --------------------------------------------------------
      # Save backend files
      # --------------------------------------------------------

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: |
            backend/main.py
            backend/requirements.txt


  # ==========================================================
  # DEPLOY JOB
  # ==========================================================

  deploy:
    name: Deploy Application
    needs: build
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Download frontend artifact
      # --------------------------------------------------------

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist


      # --------------------------------------------------------
      # Download backend artifact
      # --------------------------------------------------------

      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: backend


      # --------------------------------------------------------
      # Setup SSH
      # --------------------------------------------------------

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/github-actions

          chmod 600 ~/.ssh/github-actions

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts


      # --------------------------------------------------------
      # Prepare EC2 server
      # --------------------------------------------------------

      - name: Prepare EC2 server
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

            sudo apt-get update

            sudo apt-get install -y nginx

            sudo apt-get install -y python3
            sudo apt-get install -y python3-pip
            sudo apt-get install -y python3-venv
            sudo apt-get install -y curl

            echo "EC2 preparation completed"

          EOF


      # --------------------------------------------------------
      # Create frontend directory
      # --------------------------------------------------------

      - name: Create frontend directory
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo mkdir -p /var/www/cicd-app && sudo chown -R \$USER:\$USER /var/www/cicd-app"


      # --------------------------------------------------------
      # Create backend directory
      # --------------------------------------------------------

      - name: Create backend directory
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo mkdir -p /opt/cicd-app-backend && sudo chown -R \$USER:\$USER /opt/cicd-app-backend"


      # --------------------------------------------------------
      # Deploy backend files
      # --------------------------------------------------------

      - name: Deploy backend to EC2
        run: |
          scp -i ~/.ssh/github-actions -r \
            backend/* \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/cicd-app-backend/"


      # --------------------------------------------------------
      # Setup Python virtual environment
      # --------------------------------------------------------

      - name: Setup backend environment
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

            cd /opt/cicd-app-backend

            python3 -m venv venv

            ./venv/bin/pip install --upgrade pip

            ./venv/bin/pip install -r requirements.txt

            echo "Backend environment ready"

          EOF


      # --------------------------------------------------------
      # Deploy frontend files
      # --------------------------------------------------------

      - name: Deploy frontend to EC2
        run: |
          scp -i ~/.ssh/github-actions -r \
            frontend/dist/* \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/cicd-app/"


      # --------------------------------------------------------
      # Configure NGINX
      # --------------------------------------------------------

      - name: Configure NGINX
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

            sudo tee /etc/nginx/sites-available/cicd-app > /dev/null << 'NGINX'

            server {
                listen 4000;

                root /var/www/cicd-app;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }

            NGINX

            sudo ln -sf \
              /etc/nginx/sites-available/cicd-app \
              /etc/nginx/sites-enabled/cicd-app

            sudo nginx -t

            sudo systemctl restart nginx

            echo "NGINX configured successfully"

          EOF


      # --------------------------------------------------------
      # Check frontend health
      # --------------------------------------------------------

      - name: Check frontend health
        run: |
          ssh -i ~/.ssh/github-actions \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "curl -f http://localhost:4000"
